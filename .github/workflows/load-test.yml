name: Load test

# Runs the three k6 scenarios against a freshly started gateway on a GitHub-hosted runner and
# publishes the numbers in the run summary. Started manually (Actions tab -> Load test -> Run).
on:
  workflow_dispatch:
    inputs:
      steady_rate:
        description: "Steady test rate (req/s)"
        default: "2000"
      spike_peak:
        description: "Spike test peak (req/s)"
        default: "4000"

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build jar
        working-directory: gateway
        run: mvn -B -q package -DskipTests

      - uses: grafana/setup-k6-action@v1

      - name: Machine
        run: |
          {
            echo "cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"
            echo "cores=$(nproc)"
            echo "memory=$(free -g | awk '/Mem:/ {print $2}') GB"
            echo "java=$(java -version 2>&1 | head -1)"
            echo "k6=$(k6 version | head -1)"
          } | tee machine.txt

      - name: Run scenarios
        env:
          STEADY_RATE: ${{ inputs.steady_rate }}
          SPIKE_PEAK: ${{ inputs.spike_peak }}
        run: |
          set +e
          mkdir -p results
          start_gateway() {
            # Fresh gateway per scenario so earlier runs cannot skew the next one.
            java -XX:+UseZGC -Xmx1g -jar gateway/target/gatepulse.jar > "results/gateway-$1.log" 2>&1 &
            echo $! > gateway.pid
            for i in $(seq 1 30); do curl -fsS localhost:8080/health > /dev/null 2>&1 && break; sleep 1; done
            # Warm up the JIT and connection pools so the first measured second is not a cold start.
            k6 run --quiet -e RATE=300 -e DURATION=10s load-test/steady.js > /dev/null 2>&1
          }
          stop_gateway() {
            curl -fsS localhost:8080/admin/metrics > "results/gateway-metrics-$1.json"
            kill "$(cat gateway.pid)"; sleep 2
          }

          start_gateway steady
          k6 run -e RATE="$STEADY_RATE" --summary-export results/steady.json load-test/steady.js | tee results/steady.txt
          echo "steady_exit=${PIPESTATUS[0]}" >> results/exit-codes
          stop_gateway steady

          start_gateway spike
          k6 run -e PEAK="$SPIKE_PEAK" --summary-export results/spike.json load-test/spike.js | tee results/spike.txt
          echo "spike_exit=${PIPESTATUS[0]}" >> results/exit-codes
          stop_gateway spike

          start_gateway failover
          k6 run --summary-export results/failover.json load-test/failover.js | tee results/failover.txt
          echo "failover_exit=${PIPESTATUS[0]}" >> results/exit-codes
          stop_gateway failover
          exit 0

      - name: Summarize
        run: python3 load-test/summarize.py results machine.txt

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: load-test-results
          path: results
